name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install build and test dependencies
        run: python -m pip install --upgrade "maturin>=1.9,<2.0" "pytest>=8.3"
      - name: Build wheel
        run: maturin build --locked --out dist
      - name: Install built wheel
        shell: bash
        run: python -m pip install --no-index --force-reinstall dist/epyxid-*.whl
      - name: Run tests
        run: python -m pytest -v test_xid.py

  stubs:
    name: Type stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install build and check dependencies
        run: python -m pip install --upgrade "maturin>=1.9,<2.0" mypy
      - name: Build and install wheel
        shell: bash
        run: |
          maturin build --locked --out dist
          python -m pip install --no-index --force-reinstall dist/epyxid-*.whl
      - name: Type-check the stub
        run: python -m mypy epyxid.pyi
      - name: Compare the stub against the built module
        run: python -m mypy.stubtest epyxid --ignore-missing-stub
