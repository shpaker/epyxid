[project]
name = "epyxid"
description = "Python wrapper around Rust implementation of XID (Globally Unique ID Generator)"
requires-python = ">=3.10"
authors = [
  {name = "Aleksandr Shpak", email = "shpaker@gmail.com"},
]
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = [
  "rust",
  "xid",
  "pyo3",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Rust",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/shpaker/epyxid"
Repository = "https://github.com/shpaker/epyxid"
Issues = "https://github.com/shpaker/epyxid/issues"

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "epyxid"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
